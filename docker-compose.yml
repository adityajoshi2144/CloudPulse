version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudpulse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://cloudpulse:pulsepass@postgres:5432/cloudpulse_db
      - REDIS_URL=redis://redis:6379/0
      - KUBERNETES_ENABLED=false
      - PROMETHEUS_URL=http://prometheus:9090
      - GRAFANA_URL=http://grafana:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cloudpulse-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudpulse-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - cloudpulse-network

  postgres:
    image: postgres:16-alpine
    container_name: cloudpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudpulse
      POSTGRES_PASSWORD: pulsepass
      POSTGRES_DB: cloudpulse_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpulse -d cloudpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloudpulse-network

  redis:
    image: redis:7.2-alpine
    container_name: cloudpulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cloudpulse-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: cloudpulse-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - cloudpulse-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: cloudpulse-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cloudpulse-network

networks:
  cloudpulse-network:
    driver: bridge

volumes:
  pgdata:
  grafanadata:
