apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-backend
  namespace: cloudpulse
  labels:
    app: cloudpulse-backend
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudpulse-backend
  template:
    metadata:
      labels:
        app: cloudpulse-backend
        tier: api
    spec:
      containers:
        - name: backend
          image: cloudpulse-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: KUBERNETES_ENABLED
              value: "true"
            - name: DATABASE_URL
              value: "postgresql+asyncpg://cloudpulse:pulsepass@postgres-service.cloudpulse.svc.cluster.local:5432/cloudpulse_db"
            - name: REDIS_URL
              value: "redis://redis-service.cloudpulse.svc.cluster.local:6379/0"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cloudpulse-backend-service
  namespace: cloudpulse
  labels:
    app: cloudpulse-backend
spec:
  type: ClusterIP
  selector:
    app: cloudpulse-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
